<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cat Body -->
  <ellipse cx="100" cy="120" rx="45" ry="50" fill="#FF6B6B" stroke="#333" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="70" r="35" fill="#FF6B6B" stroke="#333" stroke-width="2"/>

  <!-- Left Ear -->
  <polygon points="75,45 70,20 85,40" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <polygon points="75,45 72,28 82,42" fill="#FFB6C1"/>

  <!-- Right Ear -->
  <polygon points="125,45 130,20 115,40" fill="#FF6B6B" stroke="#333" stroke-width="2"/>
  <polygon points="125,45 128,28 118,42" fill="#FFB6C1"/>

  <!-- Left Eye -->
  <ellipse cx="88" cy="68" rx="6" ry="10" fill="#333"/>
  <circle cx="88" cy="65" r="2" fill="white"/>

  <!-- Right Eye -->
  <ellipse cx="112" cy="68" rx="6" ry="10" fill="#333"/>
  <circle cx="112" cy="65" r="2" fill="white"/>

  <!-- Nose -->
  <polygon points="100,78 97,82 103,82" fill="#FFB6C1"/>

  <!-- Mouth -->
  <path d="M 100 82 Q 95 85 92 83" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M 100 82 Q 105 85 108 83" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Whiskers Left -->
  <line x1="70" y1="72" x2="50" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="70" y1="76" x2="50" y2="78" stroke="#333" stroke-width="1"/>

  <!-- Whiskers Right -->
  <line x1="130" y1="72" x2="150" y2="70" stroke="#333" stroke-width="1"/>
  <line x1="130" y1="76" x2="150" y2="78" stroke="#333" stroke-width="1"/>

  <!-- Left Arm -->
  <ellipse cx="70" cy="130" rx="12" ry="25" fill="#FF6B6B" stroke="#333" stroke-width="2"/>

  <!-- Right Arm -->
  <ellipse cx="130" cy="130" rx="12" ry="25" fill="#FF6B6B" stroke="#333" stroke-width="2"/>

  <!-- Left Leg -->
  <ellipse cx="85" cy="165" rx="10" ry="20" fill="#FF6B6B" stroke="#333" stroke-width="2"/>

  <!-- Right Leg -->
  <ellipse cx="115" cy="165" rx="10" ry="20" fill="#FF6B6B" stroke="#333" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 140 130 Q 160 120 165 100 Q 168 85 160 75" stroke="#FF6B6B" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M 140 130 Q 160 120 165 100 Q 168 85 160 75" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
